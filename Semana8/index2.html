<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos adaptables</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f6fa;
    }

    .productos {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(12px, 2vw, 24px);
      
      
    }

    .producto {
      flex: 1 1 200px;
      background: red;
      border-radius: 12px;
   
    }



  </style>
</head>
<body>

  <h1>Catálogo de productos</h1>

  <div class="productos">
    <article class="producto">
      <h2>Laptop</h2>
      <p>Precio: S/ 2500</p>
    </article>

    <article class="producto">
      <h2>Teclado</h2>
      <p>Precio: S/ 120</p>
    </article>

    <article class="producto">
      <h2>Mouse</h2>
      <p>Precio: S/ 60</p>
    </article>
  </div>

</body>
</html>
